name: odds-history

# 05:10 UTC daily (and on demand): pre-match odds from api-tennis.com for finished
# matches, for the market backtest (tools/market_backtest.py), saved to
# data/odds_history.csv. Each run adds the last week and works further back in time.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-and-deploy          # same group as refresh-data, so the two never push at once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch odds
        # the log is committed too, so a failed fetch can be diagnosed from the repo
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: python tools/fetch_odds.py 2>&1 | tail -n 300 > data/odds_fetch.log; cat data/odds_fetch.log

      - name: Commit if changed
        run: |
          git config user.name  "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_fetch.log
          for f in data/odds_history.csv data/odds_history_state.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No odds changes."
          else
            git commit -m "data: odds history $(date -u +%F)"
            git pull --rebase -X theirs origin "${{ github.event.repository.default_branch }}"
            git push
          fi
