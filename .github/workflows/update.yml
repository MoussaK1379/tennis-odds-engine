name: refresh-data

# Every day at 06:20 UTC (and on demand from the Actions tab):
#   1. players.json  — ATP/WTA ELO + serve/return stats (update_data.py)
#   2. matches.json  — upcoming matches, bookmaker odds, model picks (update_matches.py)
#   3. commits both and publishes the site to GitHub Pages.
# A push to main also republishes the site.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate players.json
        run: python update_data.py --out players.json

      - name: Regenerate matches.json (matches + odds)
        # Odds are a bonus: if the odds service is down, still ship the player stats.
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_matches.py --players players.json --out matches.json

      - name: Commit if changed
        run: |
          git config user.name  "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json matches.json
          if git diff --staged --quiet; then
            echo "No data changes today."
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi

  deploy:
    needs: refresh
    # Run after a refresh, or on a plain push (when refresh is skipped).
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # includes today's data commit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
