name: refresh-data

# 06:20 UTC every day (and on demand from the Actions tab):
#   1. players.json + recent_results.json — ATP/WTA ELO, serve/return stats, results (update_data.py,
#      from api-tennis.com; match history cached in data/api_tennis_matches.csv)
#   2. matches.json + history/predictions.csv — upcoming matches, odds, model picks,
#      logged predictions settled against results, track record (update_matches.py)
#   3. commits and publishes the site to GitHub Pages.
# 16:20 UTC: odds-only refresh for later matches (skips odds if the month's
# Odds API allowance is running low). A push to main also republishes the site.
on:
  schedule:
    - cron: "20 6 * * *"
    - cron: "20 16 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the latest main, not the commit the run was queued on: a queued run
          # must build on the previous run's data (and its match cache)
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate players.json + recent_results.json
        if: github.event.schedule != '20 16 * * *'
        timeout-minutes: 30          # the first run backfills ~2 years from api-tennis.com
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: python update_data.py --out players.json --results-out recent_results.json

      - name: Regenerate matches.json + prediction log
        # Odds are a bonus: if the odds service is down, still ship the player stats.
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_matches.py --players players.json --out matches.json --min-remaining 60

      - name: Commit if changed
        run: |
          git config user.name  "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in players.json matches.json recent_results.json history data; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No data changes today."
          else
            git commit -m "data: refresh $(date -u +%F)"
            # if main moved while this ran, replay this data commit on top;
            # on a clash in a data file, this run's fresher file wins
            git pull --rebase -X theirs origin "${{ github.event.repository.default_branch }}"
            git push
          fi

  deploy:
    needs: refresh
    # Run after a refresh, or on a plain push (when refresh is skipped).
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # includes today's data commit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
